{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">DIRECTORIO</p><h1>Clientes</h1></div></div><section class="card"><h2>Registrar cliente</h2><form method="post" class="form-grid"><div><label>Nombre / razón social *</label><input name="name" required></div><div><label>CC / NIT</label><input name="document"></div><div><label>Correo</label><input type="email" name="email"></div><div><label>Teléfono</label><input name="phone"></div><div class="wide"><label>Dirección</label><input name="address"></div><div><button>Guardar cliente</button></div></form></section><section class="card"><h2>Clientes registrados</h2><div class="table-wrap"><table><tr><th>Nombre</th><th>Documento</th><th>Correo</th><th>Teléfono</th><th></th></tr>{% for r in rows %}<tr><td>{{ r.name }}</td><td>{{ r.document or '—' }}</td><td>{{ r.email or '—' }}</td><td>{{ r.phone or '—' }}</td><td><a href="{{ url_for('edit_client',client_id=r.id) }}">Editar</a></td></tr>{% else %}<tr><td colspan="5">No hay clientes.</td></tr>{% endfor %}</table></div></section>{% endblock %}
