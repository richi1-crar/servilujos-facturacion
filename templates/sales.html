{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">REGISTRO</p><h1>Historial de ventas</h1></div><a class="btn" href="{{ url_for('new_sale') }}">＋ Nueva venta</a></div><section class="card"><div class="table-wrap"><table><tr><th>Consecutivo</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr>{% for s in rows %}<tr><td>{{ s.number }}</td><td>{{ s.customer_name }}</td><td>{{ s.created_at[:16] }}</td><td>{{ s.total|cop }}</td><td><span class="tag">{{ s.status }}</span></td><td><a href="{{ url_for('sale_detail',sale_id=s.id) }}">Abrir</a></td></tr>{% else %}<tr><td colspan="6">No hay ventas.</td></tr>{% endfor %}</table></div></section>{% endblock %}
