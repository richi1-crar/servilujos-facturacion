{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">COMERCIAL</p><h1>Registrar venta</h1></div></div><form method="post" class="card"><h2>Datos del cliente</h2><div class="form-grid"><div><label>Cliente registrado</label><select name="client_id"><option value="">— Seleccionar cliente —</option>{% for c in clients %}<option value="{{ c.id }}">{{ c.name }} · {{ c.document or 'Sin documento' }}</option>{% endfor %}</select></div><div><label>Nombre si no está registrado *</label><input name="customer_name"></div><div><label>Documento</label><input name="customer_document"></div><div><label>Correo</label><input type="email" name="customer_email"></div></div><hr><h2>Productos</h2><div id="items"><div class="sale-row"><select name="product_id[]" required><option value="">Selecciona producto</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }} — {{ p.price|cop }} + {{ p.tax_rate }}% IVA</option>{% endfor %}</select><input name="quantity[]" type="number" min="1" value="1" required><button type="button" class="danger small" onclick="this.parentElement.remove()">Quitar</button></div></div><button type="button" class="secondary" onclick="addRow()">＋ Agregar otro producto</button><div class="field"><label>Observaciones</label><textarea name="notes" rows="2"></textarea></div><button>Guardar venta</button></form><script>function addRow(){const first=document.querySelector('.sale-row');const row=first.cloneNode(true);row.querySelector('select').selectedIndex=0;row.querySelector('input').value=1;document.getElementById('items').appendChild(row);}</script>{% endblock %}
