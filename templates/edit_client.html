{% extends 'base.html' %}{% block content %}<h1>Editar cliente</h1><section class="card"><form method="post" class="form-grid"><div><label>Nombre *</label><input name="name" value="{{ row.name }}" required></div><div><label>CC / NIT</label><input name="document" value="{{ row.document or '' }}"></div><div><label>Correo</label><input name="email" type="email" value="{{ row.email or '' }}"></div><div><label>Teléfono</label><input name="phone" value="{{ row.phone or '' }}"></div><div class="wide"><label>Dirección</label><input name="address" value="{{ row.address or '' }}"></div><div><button>Guardar cambios</button></div></form></section>{% endblock %}
